<!--begin::Modal content CREATE-->
<div class="modal-content">
  <!--begin::Modal header-->
  <div class="modal-header" id="kt_modal_add_user_header">
      <!--begin::Modal title-->
      <h2 class="fw-bolder">Agregar Proveedores</h2>

      <!--end::Modal title-->
      <!--begin::Close-->
      <div class="btn btn-icon btn-sm btn-active-icon-primary" data-kt-users-modal-action="close" (click)="modal.dismiss()">
          <!--begin::Svg Icon | path: icons/duotune/arrows/arr061.svg-->
          <span class="svg-icon svg-icon-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
                  <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
              </svg>
          </span>
          <!--end::Svg Icon-->
      </div>
      <!--end::Close-->
  </div>
  <!--end::Modal header-->
  <!--begin::Modal body-->
  <div class="modal-body scroll-y mx-5 my-7">
      <!--begin::Form-->
      <form id="kt_modal_add_user_form" class="form" action="#">
          <!--begin::Scroll-->
          <div class="d-flex flex-column scroll-y me-n7 pe-7" id="kt_modal_add_user_scroll" data-kt-scroll="true" data-kt-scroll-activate="{default: false, lg: true}" data-kt-scroll-max-height="auto" data-kt-scroll-dependencies="#kt_modal_add_user_header" data-kt-scroll-wrappers="#kt_modal_add_user_scroll" data-kt-scroll-offset="300px">
              <!--begin::Input group-->
              <div class="fv-row mb-7">
                  <!--begin::Label-->
                  <label class="required fw-bold fs-6 mb-2">Nombre de Empresa: (*) </label>
                  <!--end::Label-->
                  <!--begin::Input-->
                  <input type="text" name="full_name" class="form-control form-control-solid mb-3 mb-lg-0" placeholder="Nombre" [(ngModel)]="full_name" />
                  <!--end::Input-->
              </div>

              <div class="fv-row row mb-7">
                  <div class="col-7">
                      <label class="required fw-bold fs-6 mb-2">Ruc de Empresa: (*) </label>
                      <input type="text" name="ruc" class="form-control form-control-solid mb-3 mb-lg-0" placeholder="77777777" [(ngModel)]="ruc" />
                  </div>
                  <div class="col-5">
                      <label class="required fw-bold fs-6 mb-2">Telefono de Empresa: (Opcional) </label>
                      <input type="text" name="phone" class="form-control form-control-solid mb-3 mb-lg-0" placeholder="999999" [(ngModel)]="phone" />
                  </div>
              </div>

              <div class="fv-row row mb-7">
                  <div class="col-7">
                      <label class="required fw-bold fs-6 mb-2">Correo electronico: (Opcional) </label>
                      <input type="text" name="email" class="form-control form-control-solid mb-3 mb-lg-0" placeholder="example@gmail.com" [(ngModel)]="email" />
                  </div>
                  <div class="col-5">
                      <label class="required fw-bold fs-6 mb-2">Dirección: (Opcional) </label>
                      <textarea class="form-control form-control-solid" rows="3" name="address" [(ngModel)]="address" placeholder="****"></textarea>
                  </div>
              </div>

              <div class="fv-row my-1">
                  <label class="required fw-bold fs-6 mb-2">Logo Provedor:(Opcional) </label>
                  <div class="custom-file">
                      <input type="file" class="custom-file-input" id="customFile"  accept=".jpeg, .bmp, .jpg, .png, .gif, .webp"  (change)="processFile($event)">
                      <label class="custom-file-label" for="customFile">Choose file</label>
                  </div>
                  <div *ngIf="IMAGEN_PREVISUALIZA">
                      <img [src]="IMAGEN_PREVISUALIZA" style="height: 100px;" alt="" srcset="">
                  </div>
              </div>
          </div>
          <!--end::Scroll-->

          <!--begin::Actions-->
          <div class="text-center pt-15">
              <button type="reset" class="btn btn-light me-3" (click)="modal.dismiss()">Cerrar</button>
              <button type="button" (click)="store()" class="btn btn-primary" data-kt-users-modal-action="submit">
                  <span class="indicator-label">Registrar</span>

                  <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading | async"></span>
                  <!-- <span class="indicator-progress">Please wait...
                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span> -->
              </button>
          </div>
          <!--end::Actions-->
      </form>
      <!--end::Form-->
  </div>
  <!--end::Modal body-->
</div>
<!--end::Modal content CREATE-->
